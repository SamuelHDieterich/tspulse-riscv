# The variants `benchmark variants` measures against the baseline, one `[[variant]]` each
# A variant is named by its settings, as listed by `build-variant --list`; its name is the build's, never typed here
# The baseline is every setting at its default, so it is never listed

[[variant]]
settings = { UNROLL = "on" }

[[variant]]
settings = { LINEAR = "blocked" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on" }

[[variant]]
settings = { MATH = "bundled" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled" }

[[variant]]
settings = { OUTPUTS = "read" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read" }

# Each of these sits on the best exact stack, so its change is the approximation alone
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "fine" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "coarse" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "tanh" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "table" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "fine" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "coarse" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "bits" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "table" }
