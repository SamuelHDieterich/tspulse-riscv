# The variants `benchmark variants` measures against the baseline, one `[[variant]]` each
# A variant is named by its settings, as listed by `build-variant --list`; its name is the build's, never typed here
# The baseline is every setting at its default, so it is never listed

[[variant]]
settings = { UNROLL = "on" }

[[variant]]
settings = { LINEAR = "blocked" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on" }

[[variant]]
settings = { MATH = "bundled" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled" }

[[variant]]
settings = { OUTPUTS = "read" }

# `held = true` marks the picks `benchmark variants --group held` runs on the held-back series
# One of them, the stack, is contained in the settings of every other
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read" }
held = true

# Each of these sits on the best exact stack, so its change is the approximation alone
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "fine" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "coarse" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "tanh" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", GELU = "table" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "fine" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "coarse" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "bits" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "table" }

# Each of these sits on the best exact stack, so its change is the skipped rows or the fewer passes alone
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", STRIDE = "2" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", STRIDE = "4" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", STRIDE = "8" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", STRIDE = "16" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", AGGREGATION = "64" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", AGGREGATION = "48" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", AGGREGATION = "32" }

# Two approximations together on the best exact stack, to see whether their savings add
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "table", GELU = "fine" }
held = true

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "table", GELU = "table" }

# These two measure accuracy, memory and traffic; their instruction counts are a worst case, since int8 math only pays off with vector instructions
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", QUANT = "w8a32" }

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", QUANT = "w8a8" }

# The fine GELU and table exp pair with a stride and with fewer passes, to see whether their savings add
[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "table", GELU = "fine", STRIDE = "2" }
held = true

[[variant]]
settings = { LINEAR = "blocked", UNROLL = "on", MATH = "bundled", OUTPUTS = "read", EXP = "table", GELU = "fine", AGGREGATION = "48" }
held = true
