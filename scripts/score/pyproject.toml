# The Python project behind `score-series` and `score-baseline`.
# uv builds it, because granite-tsfm isn't in nixpkgs and the model uses PyTorch's CPU wheel.

# Package metadata, standard across Python tools (PEP 621)
[project]
name = "score"
version = "0.1.0"
description = "Score a time series with IBM's TSPulse pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
  "granite-tsfm==0.3.12", # the TSPulse model and anomaly pipeline
  "numpy", # handles the score arrays
  "pandas>=2.3.3", # reads the series and writes the scores
  "scikit-learn>=1.7.2", # AUC-PR, the 0-1 rescale before VUS, and the pipeline's standardization
  "scipy>=1.18.1", # finds the autocorrelation peaks that set the VUS window
  "statsmodels>=0.15.0", # the autocorrelation itself
  "torch==2.11.*", # runs the model
  "typer>=0.24", # the command line
]

# Console scripts: each command calls its main function
[project.scripts]
score-series = "score.cli:main"
score-baseline = "score.baseline:main"
capture-reference = "score.reference:main"
compare-reference = "score.compare:main"
prepare-rows = "score.prepare:main"
check-model = "score.check:main"
check-spike = "score.spike_check:main"

# Dependencies for working on the code, which `uv sync` installs and the package never ships (PEP 735)
[dependency-groups]
dev = ["ruff>=0.15"]

# How to turn the source into a wheel
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Explicit, so only torch comes from this index
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ruff, the linter and formatter, run as `uv run ruff check .` and `uv run ruff format .`
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade and bugbear
select = ["E", "F", "I", "UP", "B"]
# ruff format owns the width of code, and comments are never wrapped
ignore = ["E501"]

[tool.ruff.lint.isort]
# Two blank lines between the imports and the banner that follows them
lines-after-imports = 2

# pyright, the type checker behind VS Code's Python support, reads the virtualenv that `uv sync` makes here
[tool.pyright]
venvPath = "."
venv = ".venv"
